<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trung Thu Bên Em</title>
<style>
  :root { --hong:#ffc2d4; --dam:#d6336c; --nen:#ffe3ec; --chu:#7a2244; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:"Segoe UI",Arial,sans-serif; }
  html,body { height:100%; }
  body { background:#ffd6e3; color:var(--chu); overflow:hidden; }
  .hidden { display:none !important; }

  /* Nền caro hồng */
  .screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:
      linear-gradient(45deg,#ffffff22 25%,transparent 25% 75%,#ffffff22 75%) 0 0/40px 40px,
      linear-gradient(135deg,#ffc2d4,#ffe3ec); }

  /* Khung kính mờ dùng chung */
  .glass { background:#ffffff88; backdrop-filter:blur(10px); border:1px solid #fff;
    border-radius:22px; box-shadow:0 10px 30px #d6336c33; }

  /* ---------- Màn hình khóa ---------- */
  #lock .glass { display:flex; gap:24px; padding:24px; max-width:92vw; flex-wrap:wrap; justify-content:center; }
  .anh { width:220px; height:300px; border-radius:14px; border:3px solid #fff;
    background:linear-gradient(160deg,#ffb3c9,#ffd9e4) center/cover; overflow:hidden; }
  .anh img { width:100%; height:100%; object-fit:cover; display:block; }
  .pad { width:220px; text-align:center; }
  .pad .tim { color:var(--dam); font-size:22px; }
  .pad p { font-size:13px; margin:8px 0 14px; }
  .cham { display:flex; justify-content:center; gap:10px; margin-bottom:16px; }
  .cham i { width:10px; height:10px; border-radius:50%; border:1.5px solid var(--dam); }
  .cham i.on { background:var(--dam); }
  .phim { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; justify-items:center; }
  .phim button { width:48px; height:48px; border-radius:50%; border:none; background:#fff;
    color:var(--dam); font-size:18px; cursor:pointer; box-shadow:0 2px 6px #d6336c33; }
  .phim button:active { transform:scale(.92); background:var(--hong); }
  .rung { animation:rung .4s; }
  @keyframes rung { 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }

  /* ---------- Màn hình chính ---------- */
  #home .luoi { display:grid; grid-template-columns:repeat(2,140px); gap:16px; }
  .app { height:110px; border-radius:18px; border:none; background:#ffffffaa; color:var(--chu);
    font-size:15px; cursor:pointer; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:8px; transition:transform .2s; }
  .app:hover { transform:translateY(-4px); background:#fff; }
  .app span { font-size:34px; }

  /* ---------- Cửa sổ ---------- */
  .win { position:fixed; z-index:5; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(360px,92vw); max-height:88vh; overflow:auto; padding:20px; }
  .x { position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:50%;
    border:none; background:var(--dam); color:#fff; cursor:pointer; z-index: 10; }
  .win h3 { text-align:center; font-size:14px; margin-bottom:12px; }

  /* Nhạc */
  .bia { width:150px; height:150px; margin:0 auto 12px; border-radius:12px;
    background:linear-gradient(160deg,#ffb3c9,#ffd9e4) center/cover; overflow:hidden; }
  .bia img { width:100%; height:100%; object-fit:cover; }
  #tenBai { text-align:center; font-weight:600; margin-bottom:8px; }
  #thanh { width:100%; accent-color:var(--dam); }
  .dk { display:flex; justify-content:center; gap:14px; margin:8px 0; }
  .dk button { width:40px; height:40px; border-radius:50%; border:none; background:var(--dam);
    color:#fff; cursor:pointer; font-size:16px; }
  .ds div { padding:8px 10px; border-radius:10px; font-size:13px; cursor:pointer; }
  .ds div:hover, .ds div.dang { background:#fff; }

  /* Thư */
  #thu { font-family:"Segoe Print","Brush Script MT",cursive; font-size:17px; line-height:1.7;
    color:var(--dam); white-space:pre-wrap; min-height:200px; }

  /* ---------- HIỆU ỨNG ẢNH LƠ LỬNG TOÀN MÀN HÌNH ---------- */
  #anhWin { 
    position:fixed; inset:0; z-index:8; 
    background:rgba(255, 227, 236, 0.85); /* Nền hồng mờ */
    backdrop-filter:blur(5px); overflow:hidden; 
  }
  #anhWin .x { top:16px; right:16px; z-index:10; }
  #gal { width:100%; height:100%; position:relative; }
  
  .anh-bay {
    position: absolute;
    width: 110px; 
    height: 150px; 
    object-fit: cover;
    border-radius: 12px; 
    border: 3px solid #fff;
    box-shadow: 0 8px 25px rgba(214, 51, 108, 0.3);
    cursor: pointer; 
    top: 0; left: 0; 
    will-change: transform;
    transition: border-color 0.3s, filter 0.3s;
  }
  .anh-bay:hover { 
    border-color: var(--dam); 
    filter: brightness(1.1); 
    z-index: 99 !important; /* Đưa ảnh lên trên cùng khi chạm vào */
  }

  /* Ảnh to khi click vào */
  #to { position:fixed; inset:0; z-index:11; background:#000c; display:flex;
    align-items:center; justify-content:center; }
  #to img { max-width:92vw; max-height:88vh; border:4px solid #fff; border-radius:6px; }

  /* Quà: vườn hoa */
  #qua { position:fixed; inset:0; z-index:8; background:radial-gradient(#0d2a1c,#050a08); }
  #qua canvas { width:100%; height:100%; display:block; }
  #loi { position:absolute; top:24px; left:50%; transform:translateX(-50%); padding:8px 16px;
    border-radius:20px; background:#ffe3ec; color:var(--dam); font-size:14px; text-align:center; }
  #qua .x { top:16px; right:16px; }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<!-- 1. KHÓA -->
<div id="lock" class="screen">
  <div class="glass">
    <div class="anh" id="anhKhoa"></div>
    <div class="pad">
      <div class="tim">♥</div>
      <p>Mật khẩu là ngày sinh của em</p>
      <div class="cham" id="cham"><i></i><i></i><i></i><i></i></div>
      <div class="phim" id="phim"></div>
    </div>
  </div>
</div>

<!-- 2. MÀN HÌNH CHÍNH -->
<div id="home" class="screen hidden">
  <div class="luoi">
    <button class="app" data-mo="nhac"><span>🎵</span>Music</button>
    <button class="app" data-mo="thuWin"><span>💌</span>Letter</button>
    <button class="app" data-mo="anhWin"><span>🖼️</span>Image</button>
    <button class="app" data-mo="qua"><span>🎁</span>Gift</button>
  </div>
</div>

<!-- 3. CÁC CỬA SỔ -->
<div id="nhac" class="win glass hidden">
  <button class="x" data-dong>×</button>
  <h3>MUSIC PLAYER</h3>
  <div class="bia" id="bia"></div>
  <div id="tenBai"></div>
  <input type="range" id="thanh" value="0" min="0" max="100">
  <div class="dk"><button id="truoc">⏮</button><button id="chay">▶</button><button id="sau">⏭</button></div>
  <div class="ds" id="ds"></div>
  <audio id="audio"></audio>
</div>

<div id="thuWin" class="win glass hidden">
  <button class="x" data-dong>×</button>
  <h3>Gửi em</h3>
  <div id="thu"></div>
</div>

<!-- Màn hình ẢNH toàn màn hình -->
<div id="anhWin" class="hidden">
  <button class="x" data-dong>×</button>
  <div id="gal"></div>
</div>

<!-- Trình xem ảnh to -->
<div id="to" class="hidden"><img alt=""></div>

<div id="qua" class="hidden">
  <button class="x" data-dong>×</button>
  <div id="loi">Chúc em Trung Thu thật vui nhé 🌸 (chạm vào màn hình để hoa nở)</div>
  <canvas id="cv"></canvas>
</div>

<script>
/* =====================================================
   CHỈNH Ở ĐÂY: mật khẩu, ảnh, nhạc, lời thư
   Bạn tự thêm ảnh vào thư mục "images", nhạc vào "music"
   ===================================================== */
const CONFIG = {
  matKhau: "2211",                      // ngày sinh, 4 số (ví dụ 15/03 → 1503)
  anhKhoa: "./images/Messenger_creation_7E3F73E5-BD79-4A63-88BE-506F32F53A56_1.jpeg",           // ảnh ở màn hình khóa
  nhac: [                               // danh sách bài hát
    { ten: "Yêu em hơn mỗi ngày", file: "./Yêu Em Hơn Mỗi Ngày.mp3", bia: "./images/anh5.JPG" },
    { ten: "Một đời",                    file: "./một đời.mp3", bia: "./images/anh6.jpg" }
  ],
anh: [
    "./images/7d7c4c3b-5d23-447f-b0b6-f4623348088e_20260410_185713_918_3600_1.jpg",
    "./images/anh2.jpg",
    "./images/anh3.jpg",
    "./images/anh4.jpg",
    "./images/anh5.jpg",
    "./images/anh6.jpg",
    "./images/anh7.jpg",
    "./images/anh8.jpg",
    "./images/anh9.jpg",
    "./images/anh10.jpg",
    "./images/anh11.jpg",
    "./images/anh12.jpg",
    "./images/anh13.jpg",
    "./images/anh14.jpg",
    "./images/anh15.jpg",
    "./images/anh16.jpg",
    "./images/anh17.jpg",
    "./images/anh15.jpg",
    "./images/Messenger_creation_509CD595-214E-47FF-B40E-EB3DC6EC2C7D_1.jpeg.jpg",
    "./images/Messenger_creation_CA992B84-BA43-4028-A54C-348B11448FB4_1.jpeg",
    
  ],
  thu: "Gửi em Bảo Ngân,\n\nTrung Thu năm nay anh không ở cạnh em, anh muốn em biết rằng anh lúc nào cũng phía sau ủng hộ bước đi của em.Luôn ủng hộ quyết định của em. Anh tin em là thành công. Em mạnh mẽ lắm cô bé nhỏ của anh. Anh yêu em nhiều lắm.\n\nChúc em vui vẻ,khỏe mạnh và luôn hạnh phúc nhé!\n\nYêu em ❤"
};

/* ---------- Hàm nhỏ dùng nhiều lần ---------- */
const $ = id => document.getElementById(id);
function taoAnh(src) {
  const i = new Image(); i.src = src; i.onerror = () => i.style.display = "none"; return i;
}
$("anhKhoa").append(taoAnh(CONFIG.anhKhoa));

/* ---------- 1. Màn hình khóa ---------- */
let nhap = "";
const phim = $("phim"), cham = $("cham").children;
["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(k => {
  const b = document.createElement("button");
  if (!k) { b.style.visibility = "hidden"; }
  b.textContent = k;
  b.onclick = () => bam(k);
  phim.append(b);
});
function veCham() { [...cham].forEach((c, i) => c.classList.toggle("on", i < nhap.length)); }
function bam(k) {
  if (k === "⌫") nhap = nhap.slice(0, -1);
  else if (nhap.length < CONFIG.matKhau.length) nhap += k;
  veCham();
  if (nhap.length === CONFIG.matKhau.length) {
    if (nhap === CONFIG.matKhau) {
      $("lock").classList.add("hidden"); 
      $("home").classList.remove("hidden");
      
      // Tự động phát nhạc ngay khi nhập đúng mật khẩu
      chonBai(bai, true);
    } else {
      $("cham").classList.add("rung");
      setTimeout(() => { $("cham").classList.remove("rung"); nhap = ""; veCham(); }, 400);
    }
  }
}

/* ---------- 2. Mở / đóng cửa sổ ---------- */
let floatRaf; // Biến lưu hiệu ứng lướt ảnh
document.querySelectorAll("[data-mo]").forEach(b => b.onclick = () => {
  const id = b.dataset.mo;
  $(id).classList.remove("hidden");
  if (id === "thuWin") vietThu();
  if (id === "qua") batDauVuon();
  if (id === "anhWin") batDauBay(); // Gọi hàm bay ảnh khi mở
});
document.querySelectorAll("[data-dong]").forEach(b => b.onclick = () => {
  b.parentElement.classList.add("hidden");
  if (b.parentElement.id === "thuWin") clearTimeout(timerThu);
  if (b.parentElement.id === "qua") cancelAnimationFrame(rafVuon);
  if (b.parentElement.id === "anhWin") cancelAnimationFrame(floatRaf); // Dừng bay khi đóng
});

/* ---------- 3. Nhạc ---------- */
const audio = $("audio"); let bai = 0;
CONFIG.nhac.forEach((n, i) => {
  const d = document.createElement("div"); d.textContent = n.ten;
  d.onclick = () => chonBai(i, true); $("ds").append(d);
});
function chonBai(i, phat) {
  bai = (i + CONFIG.nhac.length) % CONFIG.nhac.length;
  const n = CONFIG.nhac[bai];
  audio.src = n.file; $("tenBai").textContent = n.ten;
  $("bia").replaceChildren(taoAnh(n.bia));
  [...$("ds").children].forEach((d, j) => d.classList.toggle("dang", j === bai));
  if (phat) audio.play(); $("chay").textContent = phat ? "⏸" : "▶";
}
$("chay").onclick = () => {
  if (audio.paused) { audio.play(); $("chay").textContent = "⏸"; }
  else { audio.pause(); $("chay").textContent = "▶"; }
};
$("truoc").onclick = () => chonBai(bai - 1, true);
$("sau").onclick = () => chonBai(bai + 1, true);
audio.onended = () => chonBai(bai + 1, true);
audio.ontimeupdate = () => $("thanh").value = (audio.currentTime / audio.duration * 100) || 0;
$("thanh").oninput = e => audio.currentTime = e.target.value / 100 * audio.duration;
chonBai(0, false);

/* ---------- 4. Thư: hiệu ứng gõ chữ ---------- */
let timerThu;
function vietThu() {
  clearTimeout(timerThu); $("thu").textContent = ""; let i = 0;
  (function go() {
    if (i < CONFIG.thu.length) { $("thu").textContent += CONFIG.thu[i++]; timerThu = setTimeout(go, 60); }
  })();
}

/* ---------- 5. ẢNH LƠ LỬNG TRÊN MÀN HÌNH ---------- */
function batDauBay() {
  const gal = $("gal");
  gal.innerHTML = ""; // Xóa ảnh cũ
  let floaters = [];
  
  // Tự động nhân bản danh sách ảnh nếu ít, để có đủ 10 bức ảnh trên màn hình
  let arr = [];
  while(arr.length < 20) arr = arr.concat(CONFIG.anh);
  arr = arr.slice(0, 20); 

  arr.forEach((src) => {
    const img = taoAnh(src);
    img.className = "anh-bay";
    
    let w = 110, h = 150; // Kích thước ảnh
    // Vị trí xuất hiện ngẫu nhiên không bị lố ra ngoài
    let x = Math.random() * Math.max(0, innerWidth - w);
    let y = Math.random() * Math.max(0, innerHeight - h);
    
    // Tốc độ lướt ngẫu nhiên (chậm và mượt)
    let vx = (Math.random() > 0.5 ? 1 : -1) * (0.4 + Math.random() * 0.8);
    let vy = (Math.random() > 0.5 ? 1 : -1) * (0.4 + Math.random() * 0.8);

    // Xoay nhẹ ảnh sang trái/phải
    let angle = Math.random() * 30 - 15; // Góc ban đầu từ -15 đến 15 độ
    let vAngle = (Math.random() - 0.5) * 0.2; // Tốc độ xoay rất chậm

    img.onclick = () => { 
      $("to").querySelector("img").src = src; 
      $("to").classList.remove("hidden"); 
    };

    gal.append(img);
    floaters.push({ el: img, x, y, vx, vy, w, h, angle, vAngle });
  });

  // Vòng lặp chuyển động mượt mà
  (function ve() {
    floaters.forEach(f => {
      f.x += f.vx;
      f.y += f.vy;
      f.angle += f.vAngle;

      let maxX = innerWidth - f.w;
      let maxY = innerHeight - f.h;

      // Đập vào viền màn hình thì dội lại
      if (f.x <= 0 || f.x >= maxX) {
        f.vx *= -1; 
        f.x = f.x <= 0 ? 0 : maxX; 
      }
      if (f.y <= 0 || f.y >= maxY) {
        f.vy *= -1; 
        f.y = f.y <= 0 ? 0 : maxY; 
      }

      // Đảo chiều xoay để ảnh không bị lộn ngược vòng
      if (f.angle > 20 || f.angle < -20) f.vAngle *= -1;

      f.el.style.transform = `translate(${f.x}px, ${f.y}px) rotate(${f.angle}deg)`;
    });
    floatRaf = requestAnimationFrame(ve);
  })();
}
$("to").onclick = () => $("to").classList.add("hidden");

/* ---------- 6. Quà: vườn hoa trên canvas ---------- */
const cv = $("cv"), g = cv.getContext("2d"); let hoa = [], rafVuon;
function themHoa(x) {
  hoa.push({ x, cao: 120 + Math.random() * 200, hienTai: 0, no: 0,
             mau: 320 + Math.random() * 40, r: 16 + Math.random() * 10 });
}
function batDauVuon() {
  cv.width = innerWidth; cv.height = innerHeight; hoa = [];
  for (let i = 0; i < 5; i++) setTimeout(() => themHoa(innerWidth * (0.15 + Math.random() * 0.7)), i * 700);
  (function ve() {
    g.clearRect(0, 0, cv.width, cv.height);
    hoa.forEach(h => {
      if (h.hienTai < h.cao) h.hienTai += 1.5; else if (h.no < 1) h.no += 0.02;
      const y = cv.height - h.hienTai;
      g.strokeStyle = "#2f9e44"; g.lineWidth = 4;
      g.beginPath(); g.moveTo(h.x, cv.height); g.quadraticCurveTo(h.x + 12, cv.height - h.hienTai / 2, h.x, y); g.stroke();
      if (h.no > 0) {
        g.fillStyle = `hsl(${h.mau},85%,65%)`;
        for (let k = 0; k < 6; k++) {          // 6 cánh hoa
          g.save(); g.translate(h.x, y); g.rotate(k * Math.PI / 3);
          g.beginPath(); g.ellipse(0, -h.r * h.no, h.r * .6 * h.no, h.r * h.no, 0, 0, 7); g.fill(); g.restore();
        }
        g.fillStyle = "#ffd43b"; g.beginPath(); g.arc(h.x, y, h.r * .4 * h.no, 0, 7); g.fill();
      }
    });
    rafVuon = requestAnimationFrame(ve);
  })();
}
cv.onclick = e => themHoa(e.clientX);
</script>
</body>
</html>
